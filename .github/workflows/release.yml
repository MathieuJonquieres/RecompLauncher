name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: recomp-launcher-windows-x86_64
            binary: target/release/recomp-launcher.exe
            archive: recomp-launcher-windows-x86_64.zip
          - os: ubuntu-latest
            artifact: recomp-launcher-linux-x86_64
            binary: target/release/recomp-launcher
            archive: recomp-launcher-linux-x86_64.tar.gz
          - os: macos-latest
            artifact: recomp-launcher-macos-x86_64
            binary: target/release/recomp-launcher
            archive: recomp-launcher-macos-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --workspace --release

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ matrix.binary }}", "README.md" `
            -DestinationPath "${{ matrix.archive }}"

      - name: Package Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar -czf "${{ matrix.archive }}" "${{ matrix.binary }}" README.md

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
          fail_on_unmatched_files: true
