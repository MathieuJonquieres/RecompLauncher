[workspace]
resolver = "2"
members = ["crates/core", "crates/app", "crates/testkit"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/recomp-launcher"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
bytes = "1.7"
crc32fast = "1.4"
directories = "5.0"
fluent-templates = "0.11"
futures = "0.3"
jsonschema = "0.18"
md-5 = "0.10"
mdns-sd = "0.11"
opener = "0.7"
proptest = "1.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "http2"] }
rfd = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1.3"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sevenz-rust = "0.6"
sha1 = "0.10"
sha2 = "0.10"
socket2 = "0.5"
tar = "0.4"
tempfile = "3.13"
thiserror = "1.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "net", "io-util", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
xz2 = "0.1"
zip = { version = "2.2", default-features = false, features = ["deflate", "bzip2", "zstd"] }

# dev/test
insta = { version = "1.41", features = ["json"] }
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
